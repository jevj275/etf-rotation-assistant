<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143d33"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ETF轮动"><title>小G · ETF周轮动</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1d2c27;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:510px;margin:auto;padding:22px 16px 50px}h1{font-size:23px;margin:5px 0}h2{font-size:16px;margin:0 0 13px}.sub{font-size:12px;color:#687772;margin:0 0 20px}.card{background:white;border:1px solid #dce7e1;border-radius:16px;padding:17px;margin-bottom:13px;box-shadow:0 2px 9px #192d2610}.pill{font-size:11px;background:#e8f2ec;color:#28684a;border-radius:20px;padding:5px 8px;display:inline-block}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;color:#61716a;display:block;margin:6px 0}input,select{font-size:17px;width:100%;padding:11px 10px;border:1px solid #c8d6ce;border-radius:9px;background:#fff;color:#1d2c27;min-width:0}input:focus,select:focus{outline:2px solid #58a583;border-color:#58a583}input[type=date]{font-size:14px}.etf{padding:13px 0;border-bottom:1px solid #e5ece7}.etf:last-child{border:0;padding-bottom:0}.muted{color:#6b7972;font-size:12px}.name{font-size:15px;font-weight:700}.result{background:#143d33;color:white;border:0}.result .muted{color:#b5d0c3}.winner{font-size:26px;font-weight:800;margin:7px 0}.percent{font-weight:700}.warn{font-size:13px;line-height:1.6;color:#92572b;background:#fff4e6;padding:11px;border-radius:9px}.notice{font-size:13px;line-height:1.6;color:#cde7d9}.foot{font-size:12px;color:#6b7972;line-height:1.65}.actions{display:flex;gap:8px}button{border:1px solid #b4c9bd;background:white;color:#285540;border-radius:9px;padding:9px 12px;font-weight:600;cursor:pointer}button.primary{background:#1b634c;color:white;border-color:#1b634c}.good{color:#3aa76e}.bad{color:#ee9a9a}.datehead{margin-bottom:9px}#ranking>div{padding:5px 0;display:flex;justify-content:space-between;gap:10px}a{color:#28684a}
</style></head><body><main><div class="row"><h1>小G · ETF周轮动</h1><span class="pill">手动版 V1.2</span></div><p class="sub">离线计算 · 不自动获取行情 · 不连接交易账户</p>
<section class="card"><h2>① 调仓日期与持仓</h2><div class="grid"><div><label for="signalDate">本周信号日期</label><input type="date" id="signalDate"></div><div><label for="baselineDate">四周前基准日期</label><input type="date" id="baselineDate"></div></div><label for="holding">当前持仓</label><select id="holding"><option value="518880">黄金ETF 518880</option><option value="513100">纳指ETF 513100</option><option value="159915">创业板ETF 159915</option></select></section>
<section class="card"><div class="row"><h2>② 输入三个ETF价格</h2><button id="clearCurrent" type="button">清空最新价</button></div><div id="etfs"></div></section>
<section class="card result"><h2>③ 轮动结果</h2><div id="out"><div class="notice">输入完整数据后自动计算。</div></div></section>
<section class="card"><h2>④ 使用说明</h2><p class="foot">每周更新本周信号日、四周前的基准周收盘价，以及同一时点的三只ETF最新价格。周五盘中价格只是临时排名，不等于最终收盘结果。若价格过期、停牌、溢价异常或无法确认行情时间，请用兴业证券App人工核对，不能仅凭本工具下单。</p><p class="foot">所有输入仅保存在此设备的当前浏览器，不上传GitHub。更换设备、清除网站数据或更换网址可能丢失数据。不要在公开代码仓库上传实际持仓金额、成交记录或个人资料。</p><div class="actions"><button type="button" id="resetAll">清除全部本地输入</button></div></section>
</main><script>
(()=>{'use strict';const etfs=[['518880','黄金ETF'],['513100','纳指ETF'],['159915','创业板ETF']];const $=id=>document.getElementById(id);const key='etf-rotation-v12-manual';let data={signalDate:'',baselineDate:'',holding:'518880',prices:{}};try{let prev=JSON.parse(localStorage.getItem(key));if(prev&&typeof prev==='object'&&prev.prices)data={...data,...prev};}catch(_e){};const etfWrap=$('etfs');for(const [code,name] of etfs){let sec=document.createElement('div');sec.className='etf';sec.innerHTML=`<div class="row datehead"><span class="name">${name}</span><span class="muted">${code}</span></div><div class="grid"><div><label for="b${code}">四周前收盘价</label><input id="b${code}" inputmode="decimal" type="number" min="0" step="any" placeholder="手动输入"></div><div><label for="p${code}">周五当前价</label><input id="p${code}" inputmode="decimal" type="number" min="0" step="any" placeholder="手动输入"></div></div>`;etfWrap.append(sec);}
for(const id of ['signalDate','baselineDate','holding'])$(id).value=data[id]|| (id==='holding'?'518880':'');for(const [code] of etfs){$('b'+code).value=data.prices?.[code]?.base??'';$('p'+code).value=data.prices?.[code]?.current??'';}
function val(id){return $(id).value.trim()}function save(){data.signalDate=val('signalDate');data.baselineDate=val('baselineDate');data.holding=val('holding');data.prices={};for(const [code] of etfs){data.prices[code]={base:val('b'+code),current:val('p'+code)}}try{localStorage.setItem(key,JSON.stringify(data))}catch(_e){}render()}
function render(){const list=etfs.map(([code,name])=>{let b=val('b'+code),p=val('p'+code);return {code,name,base:b,current:p,valid:b!==''&&p!==''&&Number.isFinite(+b)&&Number.isFinite(+p)&&+b>0&&+p>0,r:b!==''&&p!==''?(+p/+b-1)*100:NaN}});const out=$('out');if(!data.signalDate||!data.baselineDate||list.some(x=>!x.valid)){out.innerHTML='<div class="notice">请填写两个日期及三只ETF的全部六个有效正数价格。</div>';return}if(data.baselineDate>=data.signalDate){out.innerHTML='<div class="notice">基准日期必须早于信号日期，请核对。</div>';return}list.sort((a,b)=>b.r-a.r);const champ=list[0],runner=list[1],gap=champ.r-runner.r;const held=etfs.find(x=>x[0]===val('holding'));let action=champ.code===val('holding')?'继续持有 '+champ.name:`候选换仓：${held?.[1]||'当前持仓'} → ${champ.name}`;out.innerHTML=`<div class="muted">当前动量冠军（仅计算结果）</div><div class="winner">${champ.name} <span style="font-size:15px">${champ.code}</span></div><div class="notice">四周涨幅 <b>${champ.r>=0?'+':''}${champ.r.toFixed(2)}%</b> · 领先第二名 <b>${gap.toFixed(2)}</b> 个百分点</div><div id="ranking" style="margin-top:13px">${list.map((x,i)=>`<div><span>${i+1}. ${x.name}</span><span>${x.r>=0?'+':''}${x.r.toFixed(2)}%</span></div>`).join('')}</div><hr style="border:0;border-top:1px solid #54786b;margin:15px 0"><b>${action}</b><p class="notice">请确认三只最新价属于同一时点，并检查停牌、溢价和信号是否稳定。</p>`}
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',save));$('clearCurrent').addEventListener('click',()=>{for(const [code] of etfs)$('p'+code).value='';save()});$('resetAll').addEventListener('click',()=>{if(!confirm('确定清除本设备保存的日期、价格和持仓选择？'))return;localStorage.removeItem(key);for(const el of document.querySelectorAll('input'))el.value='';$('holding').value='518880';save()});save();})();
</script></body></html>
